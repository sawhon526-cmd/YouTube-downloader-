```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #2563eb);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    h1 {
      color: #111827;
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Easy Downloader</h1>

    <p>
      Download your own or authorized video and media files
      using a supported direct link.
    </p>

    <input
      type="url"
      id="downloadLink"
      placeholder="Paste your direct file link here"
    >

    <button onclick="downloadFile()">
      Download
    </button>

    <div class="note">
      Use only content you own or have permission to download.
    </div>
  </div>

  <script>
    function downloadFile() {
      const link = document.getElementById("downloadLink").value.trim();

      if (!link) {
        alert("Please paste a download link first.");
        return;
      }

      try {
        new URL(link);
      } catch {
        alert("Please enter a valid link.");
        return;
      }

      const a = document.createElement("a");
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.download = "";

      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

</body>
</html>
